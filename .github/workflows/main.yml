name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies via Chocolatey
      run: |
        choco install ninja vulkan-sdk -y

    - name: Add Vulkan and Ninja to PATH
      run: |
        echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA" >> $env:GITHUB_PATH
        echo "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Eglantine-Windows-x64
        path: |
          build/bin/Release/*
          build/bin/*
          build/*.exe
          build/Release/*
