name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install dependencies via Chocolatey
      run: |
        choco install ninja vulkan-sdk glslang -y

    - name: Add Vulkan Tools to PATH
      run: |
        echo "C:\VulkanSDK\1.3.296.0\Bin" >> $env:GITHUB_PATH
        echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH
        echo "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Eglantine-Windows-x64
        path: |
          build/bin/Release/*
          build/bin/*
          build/*.exe
          build/Release/*
